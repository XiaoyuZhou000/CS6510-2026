# The one message broker (constitution VIII, research D1): a single Apache Kafka 4.1.0 node in
# KRaft mode, combined broker and controller, run natively on Windows by start-broker.ps1.
# start-broker.ps1 supplies log.dirs (KAFKA_DATA_DIR) and, with KAFKA_FLUSH_EVERY_MESSAGE=true,
# log.flush.interval.messages=1 as --override arguments. See deploy/kafka/README.md.

process.roles=broker,controller
node.id=1
controller.quorum.voters=1@127.0.0.1:19093

# Loopback only, above the Windows dynamic port range (1024-15000 on the benchmark machine).
listeners=PLAINTEXT://127.0.0.1:19092,CONTROLLER://127.0.0.1:19093
advertised.listeners=PLAINTEXT://127.0.0.1:19092
controller.listener.names=CONTROLLER
listener.security.protocol.map=PLAINTEXT:PLAINTEXT,CONTROLLER:PLAINTEXT
inter.broker.listener.name=PLAINTEXT

# Single node: replication factor and min.insync.replicas are 1.
num.partitions=1
default.replication.factor=1
min.insync.replicas=1
offsets.topic.replication.factor=1
transaction.state.log.replication.factor=1
transaction.state.log.min.isr=1

# Topics exist only as documented in the event catalog; no acknowledged write is discarded.
auto.create.topics.enable=false
unclean.leader.election.enable=false

# A starting consumer group gets its partitions without the 3 s delay.
group.initial.rebalance.delay.ms=0

# Windows: Kafka cannot rename or delete a log file that it still has open, and a failed rename
# takes the whole log directory offline (the KAFKA-1194 family). Segments therefore never roll, so
# retention and compaction never delete or rewrite a file, and topics are never deleted; the
# baseline reset wipes the data directory instead (reset-topics.ps1).
log.segment.bytes=1073741824
log.roll.ms=9223372036854775807
offsets.topic.segment.bytes=1073741824
log.retention.ms=-1
log.retention.bytes=-1
delete.topic.enable=false
