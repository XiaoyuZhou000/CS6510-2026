# The one message broker (constitution VIII, research D1): a single Apache Kafka 4.1.0 node in
# KRaft mode, combined broker and controller. See deploy/kafka/README.md for operation.
#
#   docker compose -f deploy/kafka/compose.yaml up -d
#   powershell -File deploy/kafka/create-topics.ps1
#
# Set KAFKA_FLUSH_EVERY_MESSAGE=true in the calling shell before `up` to fsync every message
# (log.flush.interval.messages=1, D15); otherwise the broker default (OS page cache) applies.
name: cs6510-kafka

services:
  cs6510-kafka:
    image: apache/kafka:4.1.0
    container_name: cs6510-kafka
    restart: "no"
    ports:
      # Host listener only on loopback, above the Windows dynamic port range.
      - "127.0.0.1:19092:19092"
    volumes:
      - cs6510-kafka-data:/var/lib/kafka/data
    environment:
      # A fixed cluster ID keeps the formatted log directory valid across container re-creation.
      CLUSTER_ID: Y3M2NTEwLWthZmthLTAwMQ
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@localhost:9093
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENERS: PLAINTEXT://:19092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://127.0.0.1:19092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_LOG_DIRS: /var/lib/kafka/data
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
      KAFKA_UNCLEAN_LEADER_ELECTION_ENABLE: "false"
      # Consumer groups of a freshly started service get their partitions without the 3 s delay.
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      # Read by the command below. Not prefixed KAFKA_, because the image turns every KAFKA_*
      # variable into a broker property.
      CS6510_FLUSH_EVERY_MESSAGE: ${KAFKA_FLUSH_EVERY_MESSAGE:-false}
    # KAFKA_LOG_FLUSH_INTERVAL_MESSAGES is set only when the flush option is chosen, so the default
    # run keeps the broker's own default instead of an equivalent explicit value.
    command:
      - /bin/sh
      - -c
      - >-
        if [ "$$CS6510_FLUSH_EVERY_MESSAGE" = true ]; then export KAFKA_LOG_FLUSH_INTERVAL_MESSAGES=1; fi;
        exec /etc/kafka/docker/run

volumes:
  cs6510-kafka-data:
    name: cs6510-kafka-data
