# Measured statement and commit budgets (research R22; plan.md "Key flows and statement budgets").
#
# Each key is a ceiling that tests enforce through support.StatementBudgets.assertWithin, and
# <key>.design is the design budget it started from. These guard against accidental round trips;
# the exact correctness and durability assertions live in the tests themselves and never relax.
#
# Revision rule (enforced by performance.StatementBudgetFileTest):
#   - Lowering a ceiling needs no evidence.
#   - A ceiling above its design value needs <key>.evidence=<label>, where <label> names an A/B
#     record in load-client/reports/microservices-architecture/checkpoints.md (feature 005) or
#     load-client/reports/event-based-architecture/checkpoints.md (feature 006), produced by
#     server/benchmark-compare.ps1, that shows higher totalTransactions beyond noise with no
#     measurable regression in p99 latency or lock contention.
#
# Only T135 and T124 (feature 005) and T056, T104, and T121 (feature 006) change the budgets
# in this file; T044 changed only this header.

# Start: 1 INSERT + commit; no SELECT (the service supplies the timestamps).
start.statements=1
start.statements.design=1
start.selects=0
start.selects.design=0
start.commits=1
start.commits.design=1

# Warm Scan: guarded UPDATE of the transaction row + INSERT of the accepted_scan row + commit.
scan.warm.statements=2
scan.warm.statements.design=2
scan.warm.selects=0
scan.warm.selects.design=0
scan.warm.commits=1
scan.warm.commits.design=1
# setAutoCommit and setTransactionIsolation calls; pooled sessions are configured once (R20).
scan.warm.sessionCalls=0
scan.warm.sessionCalls.design=0

# Cold Scan: at most two extra reads (the transaction row and the grouped accepted_scan rows), once per load.
scan.cold.extraReads=2
scan.cold.extraReads.design=2

# Warm Complete. T1: guarded UPDATE + INSERT of the attempt. T3 and reopen: two UPDATEs. One commit each.
complete.t1.statements=3
complete.t1.statements.design=3
complete.t1.commits=1
complete.t1.commits.design=1
complete.t3.statements=2
complete.t3.statements.design=2
complete.t3.commits=1
complete.t3.commits.design=1
complete.reopen.statements=2
complete.reopen.statements.design=2
complete.reopen.commits=1
complete.reopen.commits.design=1
transaction.outcome.statements=2
transaction.outcome.statements.design=2
transaction.outcome.commits=1
transaction.outcome.commits.design=1

# Inventory ApplyCheckout, independent of basket size. APPLIED: locking SELECT + outcome INSERT +
# CASE UPDATE. Rejected: locking SELECT + outcome INSERT. One commit each.
inventory.apply.statements=4
inventory.apply.statements.design=4
inventory.apply.commits=1
inventory.apply.commits.design=1
inventory.apply.rejected.statements=3
inventory.apply.rejected.statements.design=3
inventory.apply.rejected.commits=1
inventory.apply.rejected.commits.design=1

# Inventory's startup catalog publication (006 D9), independent of catalog size: one batched INSERT
# of every CatalogItemPublished row and the snapshot marker into outbox_event + the catalog_meta
# published_at UPDATE, in one commit.
inventory.catalog.publish.statements=2
inventory.catalog.publish.statements.design=2
inventory.catalog.publish.commits=1
inventory.catalog.publish.commits.design=1

# Analytics ingestion per batch, independent of batch size; no product_name writes once names are cached.
# 006 (T121): feature 005's five statements plus one consumer_offset upsert in the same commit (FR-049).
analytics.ingest.statements=6
analytics.ingest.statements.design=6
analytics.ingest.commits=1
analytics.ingest.commits.design=1
analytics.ingest.warmNameWrites=0
analytics.ingest.warmNameWrites.design=0

# Outbox relay per round of up to 500 events: SELECT undelivered + batched UPDATE of delivered_at + commit.
relay.round.statements=2
relay.round.statements.design=2
relay.round.commits=1
relay.round.commits.design=1
