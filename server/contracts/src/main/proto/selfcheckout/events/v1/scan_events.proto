// Design baseline for server/contracts/src/main/proto/selfcheckout/events/v1/scan_events.proto (D10).
// Topic selfcheckout.scan-accepted.v1 (1 partition, key transaction_id). Producer: Transaction. Consumer: Analytics.
syntax = "proto3";

package selfcheckout.events.v1;

option java_package = "selfcheckout.events.v1";
option java_multiple_files = true;

// Transaction accepted one scanned unit. Identity (transaction_id, scan_sequence); envelope event_id
// "scan:<transaction_id>:<scan_sequence>". Counts toward popularity whether or not the transaction completes.
message ScanAccepted {
  string transaction_id = 1;
  int32 scan_sequence = 2;
  string sku = 3;
  // Captured name, so Analytics never reads another service's catalog (FR-019).
  string product_name = 4;
  // Captured unit price as a decimal string with two fraction digits.
  string unit_price = 5;
  int64 accepted_at_ms = 6;
}
