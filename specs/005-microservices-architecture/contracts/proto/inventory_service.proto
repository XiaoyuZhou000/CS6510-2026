// Design baseline for Inventory Service's internal gRPC interface.
// At implementation this file moves verbatim to
// server/contracts/src/main/proto/selfcheckout/inventory/v1/inventory_service.proto,
// which becomes the authoritative, version-controlled contract (Constitution III).
// Semantics, deadlines, and status codes: ../grpc-internal-contracts.md
//
// Compatibility rules: only additive changes inside v1. Never renumber, reuse, or
// change the type of an existing field; mark retired fields `reserved`.

syntax = "proto3";

package selfcheckout.inventory.v1;

option java_multiple_files = true;
option java_package = "contracts.inventory.v1";
option java_outer_classname = "InventoryServiceProto";

service InventoryService {
  // Catalog replication for Transaction Service's product replica (R4).
  // Never called per scan.
  rpc GetCatalogVersion(GetCatalogVersionRequest) returns (GetCatalogVersionResponse);
  rpc GetCatalog(GetCatalogRequest) returns (GetCatalogResponse);

  // Checkout Saga pivot step (R5, R8). Atomic for all lines and idempotent per attempt.
  // Business outcomes are returned with status OK; gRPC error statuses are reserved
  // for transport, validation, contention, and integrity faults.
  rpc ApplyCheckout(ApplyCheckoutRequest) returns (ApplyCheckoutResponse);

  // Read-only reconciliation and diagnostics. Saga recovery may instead repeat
  // ApplyCheckout under the same attempt identifier.
  rpc GetCheckoutOutcome(GetCheckoutOutcomeRequest) returns (GetCheckoutOutcomeResponse);

  // Reserved capability (FR-032). No normal checkout path invokes it.
  // Idempotent per attempt; blocks any later ApplyCheckout for the same attempt.
  rpc RestoreCheckout(RestoreCheckoutRequest) returns (RestoreCheckoutResponse);
}

// Stable checkout-attempt identifier, associated with the transaction (FR-028).
message CheckoutAttemptKey {
  string transaction_id = 1;   // 1–40 characters; the public transaction ID
  uint32 attempt_number = 2;   // >= 1; increases by one per attempt of the transaction
}

message CheckoutLine {
  string sku = 1;              // 1–20 characters; unique within a request
  uint32 quantity = 2;         // >= 1
}

enum CheckoutOutcome {
  CHECKOUT_OUTCOME_UNSPECIFIED = 0;
  CHECKOUT_OUTCOME_APPLIED = 1;             // every line deducted atomically
  CHECKOUT_OUTCOME_INSUFFICIENT_STOCK = 2;  // nothing deducted; rejected_sku is set
  CHECKOUT_OUTCOME_INVALID_REQUEST = 3;     // unknown SKU; nothing deducted; rejected_sku is set
  CHECKOUT_OUTCOME_STOCK_RESTORED = 4;      // attempt restored or blocked earlier; nothing deducted
  CHECKOUT_OUTCOME_NOT_PROCESSED = 5;       // GetCheckoutOutcome only: Inventory has no record
}

message ApplyCheckoutRequest {
  CheckoutAttemptKey attempt = 1;
  repeated CheckoutLine lines = 2;  // the attempt's immutable snapshot; non-empty
}

message ApplyCheckoutResponse {
  CheckoutOutcome outcome = 1;      // never UNSPECIFIED or NOT_PROCESSED
  string rejected_sku = 2;          // set for INSUFFICIENT_STOCK and INVALID_REQUEST
  bool replayed = 3;                // true when the outcome was recorded by an earlier request
}

message GetCheckoutOutcomeRequest {
  CheckoutAttemptKey attempt = 1;
}

message GetCheckoutOutcomeResponse {
  CheckoutOutcome outcome = 1;      // APPLIED, INSUFFICIENT_STOCK, INVALID_REQUEST, STOCK_RESTORED, or NOT_PROCESSED
  string rejected_sku = 2;
}

enum RestoreResult {
  RESTORE_RESULT_UNSPECIFIED = 0;
  RESTORE_RESULT_RESTORED = 1;            // units added back; attempt now refuses ApplyCheckout
  RESTORE_RESULT_NOTHING_TO_RESTORE = 2;  // never applied (rejected or unknown); attempt now refuses ApplyCheckout
  RESTORE_RESULT_ALREADY_RESTORED = 3;    // repeated request; no further change
}

message RestoreCheckoutRequest {
  CheckoutAttemptKey attempt = 1;
}

message RestoreCheckoutResponse {
  RestoreResult result = 1;
  repeated CheckoutLine restored_lines = 2;  // set when result is RESTORED or ALREADY_RESTORED
}

message GetCatalogVersionRequest {}

message GetCatalogVersionResponse {
  string catalog_version = 1;  // UUID regenerated by every Inventory reset or reseed
  uint32 product_count = 2;
}

message GetCatalogRequest {}

message CatalogProduct {
  string sku = 1;
  string name = 2;
  int64 price_cents = 3;       // exact price; 1.85 is 185
}

message GetCatalogResponse {
  string catalog_version = 1;
  repeated CatalogProduct products = 2;  // complete snapshot, ascending SKU order
}
