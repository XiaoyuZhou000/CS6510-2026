// Design baseline for server/contracts/src/main/proto/selfcheckout/events/v1/catalog_events.proto (D9).
// Topic selfcheckout.catalog.v1 (1 partition, compacted). Producer: Inventory. Consumer: Transaction.
syntax = "proto3";

package selfcheckout.events.v1;

option java_package = "selfcheckout.events.v1";
option java_multiple_files = true;

// Key: the SKU. One per catalog item, published at every Inventory startup.
message CatalogItemPublished {
  string sku = 1;
  string name = 2;
  // Decimal string with two fraction digits, for example "12.99", so no binary rounding occurs.
  string price = 3;
  // UUID regenerated by every Inventory reset or reseed.
  string catalog_version = 4;
}

// Key: "__snapshot__". Published after every item of catalog_version, on the same partition.
// A consumer replaces its replica only when it has read product_count distinct SKUs of this version.
message CatalogSnapshotPublished {
  string catalog_version = 1;
  int32 product_count = 2;
}
