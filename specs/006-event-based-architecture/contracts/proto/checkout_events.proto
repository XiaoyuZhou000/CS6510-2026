// Design baseline for server/contracts/src/main/proto/selfcheckout/events/v1/checkout_events.proto (D7, D8).
// Topic selfcheckout.checkout.v1 (16 partitions, key transaction_id): produced by Transaction, consumed by Inventory.
// Topic selfcheckout.checkout-outcome.v1 (16 partitions, key transaction_id): produced by Inventory, consumed by Transaction.
syntax = "proto3";

package selfcheckout.events.v1;

option java_package = "selfcheckout.events.v1";
option java_multiple_files = true;

message AttemptId {
  string transaction_id = 1;
  int32 attempt_number = 2;
}

message CheckoutLine {
  string sku = 1;
  int32 quantity = 2;
}

// ---- selfcheckout.checkout.v1 (producer: Transaction) ----

// Transaction recorded checkout attempt n with its frozen basket. Lines are sorted by SKU, one per SKU,
// and identical on every re-send; Inventory parks a reused attempt with different lines (PAYLOAD_MISMATCH).
message CheckoutRequested {
  AttemptId attempt = 1;
  repeated CheckoutLine lines = 2;
}

// Reserved (FR-039): a restoration of the attempt's deducted units was requested.
// No production path produces it; direct tests publish it in Transaction's format (D8).
message StockRestorationRequested {
  AttemptId attempt = 1;
}

// ---- selfcheckout.checkout-outcome.v1 (producer: Inventory) ----

// Inventory deducted every line of the attempt atomically (the Saga's pivot).
message StockDeducted {
  AttemptId attempt = 1;
}

enum RejectionReason {
  REJECTION_REASON_UNSPECIFIED = 0;
  INSUFFICIENT_STOCK = 1;
  INVALID_REQUEST = 2;
}

// Inventory rejected the attempt definitively and changed no stock.
// sku is the first short (INSUFFICIENT_STOCK) or unknown (INVALID_REQUEST) SKU in SKU order.
message StockRejected {
  AttemptId attempt = 1;
  RejectionReason reason = 2;
  string sku = 3;
}

// Inventory refused the attempt because its stock was already restored or blocked; nothing was deducted.
message StockDeductionRefused {
  AttemptId attempt = 1;
}

// Reserved: Inventory restored exactly the attempt's deducted units (once).
message StockRestored {
  AttemptId attempt = 1;
}

enum RestorationResult {
  RESTORATION_RESULT_UNSPECIFIED = 0;
  // The attempt was rejected or never applied; it is now blocked against later deductions.
  NOTHING_TO_RESTORE = 1;
  // An earlier restoration already returned the units.
  ALREADY_RESTORED = 2;
}

// Reserved: Inventory recorded the restoration request without returning units.
message RestorationNotNeeded {
  AttemptId attempt = 1;
  RestorationResult result = 2;
}
